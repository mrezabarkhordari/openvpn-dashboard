{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'openvpn_dashboard/css/app.css' %}">
    <title>Login - OpenVPN Dashboard</title>
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <div class="flex min-h-screen items-center justify-center p-4">
        <div class="card w-full max-w-md p-8">
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-primary text-primary-foreground shadow-sm">
                    <i data-lucide="shield" class="h-7 w-7"></i>
                </div>
                <h1 class="m-0 text-2xl font-semibold tracking-tight">OpenVPN Dashboard</h1>
                <p class="mt-2 mb-0 text-sm text-muted-foreground">Sign in to access the admin panel</p>
            </div>

            {% if error %}
            <div class="mb-4 rounded-md border border-destructive/30 bg-destructive/10 px-3 py-2 text-center text-sm text-destructive">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" class="flex flex-col gap-4">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="input"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input"
                        placeholder="Enter your password"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-primary h-10 w-full mt-1">Sign In</button>
            </form>

            <div class="mt-6 flex items-center justify-center gap-2 border-t border-border pt-6 text-xs text-muted-foreground">
                <i data-lucide="lock" class="h-3.5 w-3.5"></i>
                Secure admin access only
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="{% static 'openvpn_dashboard/js/theme.js' %}"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
