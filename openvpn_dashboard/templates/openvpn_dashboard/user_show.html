<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show User</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'openvpn_dashboard/css/button.css' %}">
    <link rel="stylesheet" href="{% static 'openvpn_dashboard/css/button-del.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px; /* Adjusted width */
            margin: 20px auto;
            padding: 20px;
            position: relative; /* Make container relative for absolute positioning */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px; /* Adjusted margin */
        }

        form {
            background-color: #f2f2f2;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: calc(100% - 16px); /* Adjusted width */
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            resize: vertical;
        }

        input[type="text"][readonly],
        input[type="number"][readonly],
        select[readonly],
        textarea[readonly] {
            background-color: #f9f9f9;
        }

        @media (max-width: 600px) {
            .container { margin: 12px; padding: 12px; }
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Show User</h1>
            <a href="{% url 'user_list' %}" class="button-4">Back to User List</a>
        </div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="buttons">
                <a href="{% url 'account_list' %}" class="button-4">Back</a>
            </div>
        </form>
    </div>
</body>
</html>
