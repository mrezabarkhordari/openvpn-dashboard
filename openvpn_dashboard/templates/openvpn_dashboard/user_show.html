{% extends 'openvpn_dashboard/base.html' %}
{% load static %}

{% block title %}Show User - OpenVPN Dashboard{% endblock %}

{% block content %}
<div class="page-wrapper max-w-2xl">
    <div class="page-header">
        <h1>Show User</h1>
        <div class="page-header-actions">
            <a href="{% url 'user_list' %}" class="btn btn-outline">Back to Users</a>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-grid">
                    {% for field in form %}
                    <div class="form-group {% if field.name == 'info' %}full-width{% endif %}">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                </div>
                <div class="mt-6 flex justify-end">
                    <a href="{% url 'account_list' %}" class="btn btn-outline">Back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
