{% extends 'openvpn_dashboard/base.html' %}
{% load static %}

{% block title %}Delete Account - OpenVPN Dashboard{% endblock %}

{% block content %}
<div class="page-wrapper max-w-lg">
    <div class="page-header">
        <h1>Delete Account</h1>
    </div>
    <div class="card">
        <div class="card-body">
            <p class="mt-0 text-muted-foreground">Are you sure you want to delete this account?</p>
            <form method="post" class="mt-6 flex flex-wrap gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-destructive">Confirm Delete</button>
                <a href="{% url 'account_list' %}" class="btn btn-outline">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
