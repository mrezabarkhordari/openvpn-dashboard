<div id="qr-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="qr-modal-title">
    <div class="modal-content qr-modal-content">
        <div class="modal-header">
            <div class="modal-icon info">
                <i data-lucide="qr-code" class="h-5 w-5"></i>
            </div>
            <div>
                <h3 id="qr-modal-title" class="modal-title">Config QR Code</h3>
                <p id="qr-modal-account" class="m-0 text-sm text-muted-foreground"></p>
            </div>
        </div>
        <div class="modal-body mb-4">
            <div id="qr-modal-frame" class="qr-frame">
                <img id="qr-modal-image" alt="OpenVPN config QR code" width="240" height="240">
            </div>
            <p id="qr-modal-error" class="hidden text-sm text-destructive"></p>
            <p class="mt-3 mb-1 text-sm text-muted-foreground">Scan with the phone camera or OpenVPN Connect to download this account's config. The phone must be able to reach this address:</p>
            <code id="qr-modal-url" class="qr-url"></code>
        </div>
        <div class="modal-footer">
            <button type="button" class="modal-btn modal-btn-cancel" id="qr-modal-copy">Copy link</button>
            <button type="button" class="modal-btn modal-btn-confirm modal-btn-primary" id="qr-modal-close">Close</button>
        </div>
    </div>
</div>
